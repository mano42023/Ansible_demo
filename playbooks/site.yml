---
- name: Configure application servers
  hosts: application_servers
  gather_facts: true
  tasks:
    - name: Confirm the playbook is available
      ansible.builtin.debug:
        msg: "Ansible_demo playbook loaded successfully."

    - name: Display the configured demo environment
      ansible.builtin.debug:
        var: demo_environment

    - name: Install nginx
      ansible.builtin.package:
        name: nginx
        state: present

    - name: Start nginx service
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
